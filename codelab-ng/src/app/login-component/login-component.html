<div class="flex justify-center items-center">
  <form [formGroup]="form" (ngSubmit)="iniciarSesion()" class="shadow-md p-10 m-5">
    <h2 class="text-blue-900 mb-5">Iniciar sesi&oacute;n</h2>
    <p>
      <mat-form-field class="w-full">
        <mat-label>Correo</mat-label>
        <input matInput formControlName="correo" type="email" />
        <mat-icon matSuffix>email</mat-icon>
      </mat-form-field>
    </p>
    <p>
      <mat-form-field class="w-full">
        <mat-label>Clave</mat-label>
        <input matInput formControlName="clave" [type]="ocultar() ? 'password' : 'text'" />
        <button matIconButton matSuffix type="button" (click)="ocultar.set(!ocultar())">
          <mat-icon>
            {{ ocultar() ? 'visibility' : 'visibility_off' }}
          </mat-icon>
        </button>
      </mat-form-field>
    </p>
    <button codelabButton appareance="primary" type="submit" [disabled]="isLoading()">Iniciar sesi&oacute;n</button>
  </form>
</div>
